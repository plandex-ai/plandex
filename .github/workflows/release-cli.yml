name: Release CLI

on:
  push:
    tags:
      - "cli*"
  workflow_dispatch:

jobs:
  build:
    name: Build CLI — ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            ext: ""
          - os: ubuntu-latest
            arch: arm64
            ext: ""
          - os: macos-latest
            arch: amd64
            ext: ""
          - os: macos-latest
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: app/cli/go.sum

      - name: Build
        working-directory: app/cli
        env:
          GOOS: ${{ contains(matrix.os, 'macos') && 'darwin' || 'linux' }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X plandex-cli/version.Version=${GITHUB_REF_NAME#cli/}" \
            -o plandex${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plandex-${{ contains(matrix.os, 'macos') && 'darwin' || 'linux' }}-${{ matrix.arch }}
          path: app/cli/plandex${{ matrix.ext }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/cli')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          for dir in */; do
            (cd "$dir" && sha256sum * >> ../checksums.txt)
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
